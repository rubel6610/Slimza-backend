services:
  mysql:
    image: mysql:8.0
    container_name: slimza-mysql
    restart: unless-stopped
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
      MYSQL_DATABASE: ${DB_NAME:-slimza}
      MYSQL_USER: ${DB_USER:-slimza_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
    volumes:
      - slimza-mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'root',
          '-p${DB_ROOT_PASSWORD:-rootsecret123}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: slimza-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--appendonly',
        'yes',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - slimza-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    container_name: slimza-minio
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - slimza-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slimza-backend
    ports:
      - '${PORT:-5173}:${PORT:-5173}'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - slimza-uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5173
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-slimza}
      - DB_USER=${DB_USER:-slimza_admin}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
      - DATABASE_URL=mysql://${DB_USER:-slimza_admin}:${DB_PASSWORD:-secret123}@mysql:3306/${DB_NAME:-slimza}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secret123}
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=slimza-files
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://127.0.0.1:9000/slimza-files}
    restart: unless-stopped

volumes:
  slimza-mysql-data:
  slimza-uploads:
  slimza-redis-data:
  slimza-minio-data:
