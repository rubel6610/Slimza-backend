services:
  mysql:
    image: mysql:8.0
    container_name: slimza-mysql
    restart: unless-stopped
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
      MYSQL_DATABASE: ${DB_NAME:-slimza}
      MYSQL_USER: ${DB_USER:-slimza_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
    volumes:
      - slimza-mysql-data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootsecret123']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slimza-backend-dev
    ports:
      - '${PORT:-4000}:${PORT:-4000}'
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - slimza-uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-slimza}
      - DB_USER=${DB_USER:-slimza_admin}
      - DB_PASSWORD=${DB_PASSWORD:-secret123}
      - DATABASE_URL=mysql://${DB_USER:-slimza_admin}:${DB_PASSWORD:-secret123}@mysql:3306/${DB_NAME:-slimza}
    restart: unless-stopped

volumes:
  slimza-mysql-data:
  slimza-uploads:
